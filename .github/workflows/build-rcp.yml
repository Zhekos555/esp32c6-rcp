name: Build ESP32-C6 OpenThread RCP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.5

    steps:
      - name: Build ESP32-C6 USB OpenThread RCP
        shell: bash
        run: |
          set -euo pipefail
          . /opt/esp/idf/export.sh

          cd /opt/esp/idf/examples/openthread/ot_rcp

          idf.py set-target esp32c6

          # Change RCP transport from UART to USB Serial/JTAG
          sed -i '/^CONFIG_OPENTHREAD_RCP_UART=y$/d' sdkconfig
          sed -i '/^# CONFIG_OPENTHREAD_RCP_USB_SERIAL_JTAG is not set$/d' sdkconfig
          cat >> sdkconfig <<'EOF'
          # CONFIG_OPENTHREAD_RCP_UART is not set
          CONFIG_OPENTHREAD_RCP_USB_SERIAL_JTAG=y
          EOF

          idf.py reconfigure
          idf.py build

          echo "=== FINAL RCP CONFIG ==="
          grep -E '^CONFIG_OPENTHREAD_RCP_|^# CONFIG_OPENTHREAD_RCP_' sdkconfig

          # Stop if USB transport was not enabled
          grep -qx 'CONFIG_OPENTHREAD_RCP_USB_SERIAL_JTAG=y' sdkconfig
          grep -qx '# CONFIG_OPENTHREAD_RCP_UART is not set' sdkconfig

          mkdir -p "$GITHUB_WORKSPACE/firmware"
          cp build/bootloader/bootloader.bin "$GITHUB_WORKSPACE/firmware/"
          cp build/partition_table/partition-table.bin "$GITHUB_WORKSPACE/firmware/"
          cp build/esp_ot_rcp.bin "$GITHUB_WORKSPACE/firmware/"
          cp build/flasher_args.json "$GITHUB_WORKSPACE/firmware/"
          cp build/flash_args "$GITHUB_WORKSPACE/firmware/"
          cp sdkconfig "$GITHUB_WORKSPACE/firmware/"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-openthread-rcp-usb
          path: firmware/
          if-no-files-found: error
